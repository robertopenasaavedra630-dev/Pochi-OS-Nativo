name: Crear Pochi OS APK

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Descomprimir proyecto Pochi OS
        run: |
          unzip -o Pochi_OS_Android_v1_Completo_CORREGIDO.zip
          ls -la

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Construir APK Android
        working-directory: Pochi_OS_Android_v1_Completo_CORREGIDO
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-OS-APK
          path: Pochi_OS_Android_v1_Completo_CORREGIDO/app/build/outputs/apk/debug/app-debug.apk
