name: Crear Pochi OS APK

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Buscar ZIP correcto de Pochi OS
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Pochi_OS_Android_v1_Completo_BUILD_OK*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP BUILD_OK."
            ls -la
            exit 1
          fi

          echo "USANDO ESTE ZIP:"
          echo "$ZIP"

          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto Android
        run: |
          SETTINGS=$(find proyecto -name settings.gradle -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find proyecto -maxdepth 6 -type f
            exit 1
          fi

          PROYECTO=$(dirname "$SETTINGS")

          echo "PROYECTO ANDROID:"
          echo "$PROYECTO"

          echo "$PROYECTO" > proyecto_ruta.txt

      - name: Corregir repositorios de Gradle
        run: |
          PROYECTO=$(cat proyecto_ruta.txt)

          if [ -f "$PROYECTO/settings.gradle" ]; then
            sed -i 's/PREFER_SETTINGS/PREFER_PROJECT/g' "$PROYECTO/settings.gradle"
            sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g' "$PROYECTO/settings.gradle"
          fi

          echo "settings.gradle corregido:"
          cat "$PROYECTO/settings.gradle"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Construir APK
        run: |
          PROYECTO=$(cat proyecto_ruta.txt)
          cd "$PROYECTO"
          gradle assembleDebug --no-daemon

      - name: Buscar APK
        run: |
          echo "APK GENERADO:"
          find proyecto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-OS-APK
          path: proyecto/**/*.apk
          if-no-files-found: error
