name: Crear Pochi OS APK

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Descomprimir Pochi OS
        run: |
          mkdir proyecto
          unzip -o Pochi_OS_Android_v1_Completo_BUILD_OK.zip -d proyecto
          find proyecto -maxdepth 4 -type f

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Construir APK
        run: |
          PROYECTO=$(dirname "$(find proyecto -name settings.gradle -type f | head -1)")
          echo "Proyecto: $PROYECTO"
          cd "$PROYECTO"
          gradle assembleDebug --no-daemon

      - name: Buscar APK
        run: find proyecto -name "*.apk" -type f

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-OS-APK
          path: proyecto/**/*.apk
