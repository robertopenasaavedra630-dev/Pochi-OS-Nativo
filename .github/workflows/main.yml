name: Crear Pochi OS APK

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android
        uses: android-actions/setup-android@v4

      - name: Aceptar licencias Android
        run: yes | sdkmanager --licenses

      - name: Instalar herramientas Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Buscar Pochi OS v2
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Pochi_OS_Android_v2_BASE_OK.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró Pochi_OS_Android_v2_BASE_OK.zip"
            echo "Archivos encontrados:"
            ls -la
            exit 1
          fi

          echo "ZIP ENCONTRADO:"
          echo "$ZIP"

          rm -rf proyecto
          mkdir -p proyecto

          unzip -o "$ZIP" -d proyecto

      - name: Encontrar proyecto Android
        run: |
          SETTINGS=$(find proyecto -name settings.gradle -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle"
            find proyecto -maxdepth 8 -type f
            exit 1
          fi

          PROYECTO=$(dirname "$SETTINGS")

          echo "PROYECTO ANDROID:"
          echo "$PROYECTO"

          echo "$PROYECTO" > proyecto_ruta.txt

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Construir APK
        run: |
          PROYECTO=$(cat proyecto_ruta.txt)

          echo "Construyendo desde:"
          echo "$PROYECTO"

          cd "$PROYECTO"

          gradle assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          echo "APK GENERADO:"

          find proyecto -type f -name "*.apk" -print

          APK=$(find proyecto -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK"
            exit 1
          fi

          echo "APK ENCONTRADO:"
          echo "$APK"

          ls -lh "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pochi-OS-APK-v2
          path: proyecto/**/*.apk
          if-no-files-found: error
